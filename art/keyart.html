<title>馬路求生記 視覺樣張</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one full-bleed game screen (3D diorama + HUD), then a short note. Deliberately single, bright look. */
:root {
  --sky-top: #8fd8ff; --sky-bot: #ffe9c7;
  --ink: #3a2a4d; --cream: #fff8ec;
  --tomato: #ff6b4a; --tomato-deep: #d8452a;
  --sun: #ffc93c; --sun-deep: #e29a12;
  --teal: #29c4a9; --teal-deep: #179281;
  --grape: #7b5cff; --grape-deep: #5136d6;
  --f-cute: "Huninn", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Fredoka", "Huninn", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: #2b2140; color: var(--ink); font-family: var(--f-cute); margin: 0; }
.screen { position: relative; width: 100%; height: min(78vh, 760px); min-height: 460px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 10%, var(--sky-top) 0%, #bfe8ff 45%, var(--sky-bot) 100%); }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 100% at 50% 45%, transparent 60%, rgba(60,30,80,.28) 100%); }

/* HUD */
.hud { position: absolute; inset: 0; pointer-events: none;
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; justify-content: space-between; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.level { display: flex; align-items: center; }
.medal { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
  background: radial-gradient(circle at 35% 28%, #fff3b0 0 18%, var(--sun) 45%, var(--sun-deep) 100%);
  box-shadow: 0 5px 0 #b8760a, 0 10px 18px rgba(80,40,0,.35), inset 0 -6px 10px rgba(180,100,0,.35);
  font-family: var(--f-num); font-weight: 700; font-size: 34px; color: #fff; text-shadow: 0 3px 0 #c27b08; }
.ribbon { margin-left: -18px; padding: 8px 18px 10px 28px; border-radius: 0 16px 16px 0; color: #fff; font-size: 19px; letter-spacing: .04em;
  background: linear-gradient(180deg, #ff8a6a, var(--tomato) 55%, var(--tomato-deep)); box-shadow: 0 4px 0 #a8321b, 0 8px 16px rgba(120,30,10,.3);
  text-shadow: 0 2px 0 rgba(150,40,20,.6); white-space: nowrap; }
.ribbon small { display: block; font-size: 12px; opacity: .9; letter-spacing: .08em; }
.stats { display: flex; gap: 10px; align-items: center; }
.pill { white-space: nowrap; display: flex; align-items: center; gap: 8px; padding: 6px 14px 7px 8px; border-radius: 999px; background: rgba(255,255,255,.92);
  box-shadow: 0 4px 0 rgba(90,60,120,.25), 0 8px 16px rgba(60,30,90,.18); font-family: var(--f-num); font-weight: 700; font-size: 20px; color: var(--ink);
  font-variant-numeric: tabular-nums; }
.pill .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 15px;
  background: radial-gradient(circle at 35% 30%, #a996ff, var(--grape) 60%, var(--grape-deep)); box-shadow: inset 0 -3px 0 rgba(40,20,120,.35); }
.pill .of { font-size: 14px; opacity: .55; font-weight: 600; }
.stars { display: flex; gap: 2px; }
.star { width: 22px; height: 22px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  background: linear-gradient(180deg, #fff2a8, var(--sun) 50%, var(--sun-deep)); }
.star.off { background: rgba(90,60,120,.18); }
.round { pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 28%, #fff 0 15%, #eef3ff 50%, #c9d3f0); box-shadow: 0 4px 0 #9aa6cc, 0 8px 14px rgba(40,30,90,.25); }
.round svg { width: 22px; height: 22px; }

.bubble { position: absolute; transform: translate(-50%, -100%); padding: 8px 14px 9px; border-radius: 16px; background: #fff; color: var(--tomato-deep);
  font-size: 18px; white-space: nowrap; box-shadow: 0 4px 0 rgba(200,70,40,.25), 0 10px 20px rgba(60,20,40,.2); animation: pop 2.4s ease-in-out infinite; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); border: 10px solid transparent; border-top-color: #fff; border-bottom: 0; }
@keyframes pop { 0%, 100% { transform: translate(-50%, -100%) scale(1); } 50% { transform: translate(-50%, -106%) scale(1.04); } }

.bottom { display: flex; justify-content: center; align-items: flex-end; gap: 14px; }
.btn { pointer-events: auto; border: 0; cursor: pointer; font-family: var(--f-cute); color: #fff; font-size: 20px; letter-spacing: .06em;
  padding: 12px 26px 14px; border-radius: 22px; text-shadow: 0 2px 0 rgba(0,0,0,.18); position: relative; transition: transform .08s; }
.btn::before { content: ""; position: absolute; left: 10px; right: 10px; top: 5px; height: 38%; border-radius: 14px; background: linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0)); }
.btn:active { transform: translateY(4px); }
.btn.wait { font-size: 22px; padding: 14px 34px 16px; background: linear-gradient(180deg, #ffe07a, var(--sun) 55%, var(--sun-deep)); box-shadow: 0 6px 0 #b8760a, 0 12px 20px rgba(120,70,0,.35); color: #6b3d00; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.btn.undo { background: linear-gradient(180deg, #5fe3c8, var(--teal) 55%, var(--teal-deep)); box-shadow: 0 6px 0 #0f6b5f, 0 12px 20px rgba(0,80,70,.3); }
.btn.reset { background: linear-gradient(180deg, #a996ff, var(--grape) 55%, var(--grape-deep)); box-shadow: 0 6px 0 #3a22a8, 0 12px 20px rgba(40,20,120,.3); }
.btn:focus-visible, .round:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); font-size: 18px; }

.note { max-width: 860px; margin: 0 auto; padding-block: 26px 40px; color: #efe6ff; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.note h2 { font-size: 20px; margin: 0 0 8px; color: #fff; font-weight: 400; }
.note ul { margin: 0; padding-left: 1.2em; }
.note li { margin-bottom: 6px; }
@media (max-width: 640px) {
  .medal { width: 52px; height: 52px; font-size: 26px; } .ribbon { font-size: 16px; } .pill { font-size: 16px; } .star { width: 16px; height: 16px; }
  .btn { font-size: 16px; padding: 10px 16px 12px; } .btn.wait { font-size: 18px; padding: 12px 20px 14px; } .stats .round { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }
</style>

<div class="screen" id="screen">
  <div class="loading" id="loading">街景搭建中…</div>
  <div class="vignette"></div>
  <div class="hud">
    <div class="top">
      <div class="level"><div class="medal">3</div><div class="ribbon"><small>第 3 關</small>推嬰兒車回家</div></div>
      <div class="stats">
        <div class="pill"><span class="ico">步</span>18<span class="of">/ 30</span></div>
        <div class="pill" aria-label="目前三顆星"><div class="stars"><span class="star"></span><span class="star"></span><span class="star"></span></div></div>
        <button class="round" id="pause" aria-label="暫停"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="2" fill="#5b4b8a"/><rect x="14" y="5" width="4" height="14" rx="2" fill="#5b4b8a"/></svg></button>
      </div>
    </div>
    <div class="bottom">
      <button class="btn undo" id="b-undo">↶ 復原</button>
      <button class="btn wait" id="b-wait">等一下</button>
      <button class="btn reset" id="b-reset">⟲ 重來</button>
    </div>
  </div>
  <div class="bubble" id="bubble" hidden>車來了，快推！</div>
</div>

<div class="note">
  <h2>這是視覺樣張，還不能玩</h2>
  <ul>
    <li>畫的是第 3 關的同一個瞬間：嬰兒車剛被推下馬路，左邊有車開過來。</li>
    <li>畫面會動，但只是待機動畫（人物呼吸、車子怠速、危險格閃爍），按鈕還沒有接上遊戲規則。</li>
    <li>推得動的東西頭上有白色小箭頭在轉，地上有光圈；違停機車沒有。紅、橘、黃格是一、二、三步後車子會開到的地方。</li>
    <li>街屋上的鐵窗、冷氣、頂樓水塔、騎樓磁磚和路邊紅線，都是為了讓人一看就知道這是台灣街頭。</li>
  </ul>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const SCENE = /*__SCENE__*/;
const W = SCENE.w, H = SCENE.h;
const T = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? '#' : SCENE.tiles[y][x];
function hash(x, y) { let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

try { await Promise.race([document.fonts.load('64px Huninn'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}

const screen = document.getElementById('screen');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
screen.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xcfeaff, 0xffc89a, 0.55));
const sun = new THREE.DirectionalLight(0xfff0d6, 3.4);
sun.position.set(-6, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 8, bottom: -8, near: 1, far: 40 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 4;
scene.add(sun);

// ---------- helpers ----------
const X = x => x - W / 2 + 0.5, Z = y => y - H / 2 + 0.5;
const mats = new Map();
function toy(color, o = {}) {
  const key = o.map ? null : color + JSON.stringify(o);
  let made;
  if (key === null || !mats.has(key)) mats.set(key, made = new THREE.MeshPhysicalMaterial({ color, roughness: o.r ?? 0.42, metalness: o.m ?? 0, clearcoat: o.cc ?? 0.55, clearcoatRoughness: 0.35,
    emissive: o.e ?? 0x000000, emissiveIntensity: o.ei ?? 1, envMapIntensity: o.env ?? 0.32, transparent: !!o.t, opacity: o.t ?? 1, map: o.map ?? null, alphaTest: o.at ?? 0, side: o.side ?? THREE.FrontSide }));
  return key === null ? made : mats.get(key);
}
const rbox = (w, h, d, r = 0.06, seg = 4) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3));
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; }
function textTex(text, { w = 256, h = 128, bg = '#fff', fg = '#e33', font = 'Huninn', size = 80, vertical = false, radius = 18 } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.beginPath(); g.roundRect(0, 0, w, h, radius); g.fill(); }
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `${size}px ${font}, "PingFang TC", sans-serif`;
  if (vertical) [...text].forEach((ch, i, a) => g.fillText(ch, w / 2, h / 2 + (i - (a.length - 1) / 2) * size * 1.05));
  else g.fillText(text, w / 2, h / 2 + size * 0.05);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const anims = [];

// ---------- the board ----------
const board = mesh(rbox(W + 0.7, 0.9, H + 0.5, 0.22), toy('#f3dcc0', { cc: 0.2, r: 0.7 }), 0, -0.48, 0.1);
mesh(rbox(W + 0.5, 0.3, H + 0.3, 0.12), toy('#c88f62', { cc: 0.1, r: 0.8 }), 0, -0.95, 0.1); // soil layer under the board edge

// road
const roadMat = toy('#4f5874', { cc: 0.25, r: 0.65 });
mesh(new THREE.BoxGeometry(W, 0.06, 2), roadMat, 0, -0.03, (Z(4) + Z(5)) / 2);
for (let x = 0; x < W; x++) mesh(new THREE.BoxGeometry(0.42, 0.012, 0.06), toy('#fbfbf6', { cc: 0 }), X(x), 0.006, (Z(4) + Z(5)) / 2);
mesh(new THREE.BoxGeometry(W, 0.012, 0.05), toy('#fbfbf6', { cc: 0 }), 0, 0.006, Z(5) + 0.44);

// sidewalk: tiles (騎樓磁磚) on a raised slab, with a red-painted curb (紅線)
const SW_H = 0.22;
mesh(new THREE.BoxGeometry(W - 0.02, SW_H, 3), toy('#e9b48c', { cc: 0.1, r: 0.8 }), 0, SW_H / 2 - 0.02, Z(2));
const curb = mesh(rbox(W, SW_H + 0.02, 0.12, 0.03), toy('#ff4d3d', { cc: 0.6 }), 0, SW_H / 2 - 0.01, Z(3) + 0.47);
for (let i = 0; i < W * 2; i += 2) mesh(new THREE.BoxGeometry(0.5, SW_H + 0.025, 0.125), toy('#fff5ee', { cc: 0.6 }), -W / 2 + 0.25 + i * 0.5 + 0.5, SW_H / 2 - 0.01, Z(3) + 0.47);
const tileGeo = rbox(0.46, 0.06, 0.46, 0.04, 2);
const tilesA = [], tilesB = [];
for (let y = 1; y <= 3; y++) for (let x = 0; x < W; x++) {
  const t = T(x, y); if (t === '#' || t === '^') continue;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) ((i + j + x + y) % 2 ? tilesA : tilesB).push([X(x) - 0.245 + i * 0.49, Z(y) - 0.245 + j * 0.49]);
}
for (const [list, col] of [[tilesA, '#ffd2b0'], [tilesB, '#ffc196']]) {
  const im = new THREE.InstancedMesh(tileGeo, toy(col, { cc: 0.35, r: 0.5 }), list.length);
  const m4 = new THREE.Matrix4(); list.forEach(([x, z], i) => { m4.makeTranslation(x, SW_H + 0.01, z); im.setMatrixAt(i, m4); });
  im.receiveShadow = true; scene.add(im);
}

// the step (台階): a raised platform with three treads on each side
for (let y = 1; y <= 3; y++) {
  const x = X(6), z = Z(y);
  const riser = toy('#d98f62', { cc: 0.2 }), tread = toy('#ffe3cc', { cc: 0.4 });
  for (let k = 0; k < 3; k++) {
    const hgt = 0.11 * (k + 1), off = 0.42 - k * 0.1;
    for (const s of [-1, 1]) { mesh(new THREE.BoxGeometry(0.1, hgt, 0.98), riser, x + s * off, SW_H + hgt / 2, z); mesh(new THREE.BoxGeometry(0.1, 0.02, 0.98), tread, x + s * off, SW_H + hgt + 0.01, z); }
  }
  mesh(rbox(0.44, 0.38, 0.98, 0.03), toy('#ffe8d4', { cc: 0.45 }), x, SW_H + 0.19, z);
}
// a little warning plate on the step
const stepSign = mesh(rbox(0.5, 0.26, 0.04, 0.05), toy('#ffffff', { map: textTex('台階', { w: 256, h: 128, bg: '#ffb020', fg: '#5a2b00', size: 76 }) }), X(6), SW_H + 0.62, Z(3) + 0.3);
anims.push(t => { stepSign.position.y = SW_H + 0.62 + Math.sin(t * 2) * 0.03; });

// ---------- buildings (台灣街屋) ----------
const bodyCols = ['#ff8f7a', '#ffcf5c', '#7cc8ff', '#b39cff', '#73dcb2', '#ff9ec8'];
const shopNames = ['早餐', '藥局', '麵店', '茶飲', '便當', '冰品', '書店', '五金'];
const signCols = [['#ff3b3b', '#fff'], ['#ffd21f', '#c4161c'], ['#1e6fe0', '#fff'], ['#16a34a', '#fff'], ['#ffffff', '#e11d48']];
const cageTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); g.strokeStyle = '#fff'; g.lineWidth = 5;
  for (let i = 4; i < 64; i += 14) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 64); g.stroke(); } g.lineWidth = 4; g.strokeRect(2, 2, 60, 60); g.beginPath(); g.moveTo(0, 32); g.lineTo(64, 32); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const glass = toy('#9fd6ff', { r: 0.08, cc: 1, m: 0.1 });
let shopIdx = 0;
function shophouse(x, y, floors, opts = {}) {
  const g = new THREE.Group(); g.position.set(X(x), 0, Z(y)); scene.add(g);
  const col = bodyCols[Math.floor(hash(x, y) * bodyCols.length)];
  const FH = 0.78, hgt = 0.3 + floors * FH;
  mesh(rbox(0.98, hgt, 0.98, 0.07), toy(col, { cc: 0.45, r: 0.5 }), 0, hgt / 2, 0, g);
  const front = 0.5;
  // ground floor: lit shop opening + horizontal sign
  if (opts.shop) {
    mesh(rbox(0.8, 0.5, 0.06, 0.04), toy('#5a3a2a', { e: 0xffb060, ei: 0.55 }), 0, 0.27, front - 0.02, g);
    const [bg, fg] = signCols[shopIdx % signCols.length];
    const name = shopNames[shopIdx++ % shopNames.length];
    mesh(rbox(0.92, 0.22, 0.07, 0.05), toy('#ffffff', { map: textTex(name, { w: 256, h: 64, bg, fg, size: 48, radius: 10 }), cc: 0.8 }), 0, 0.66, front + 0.03, g);
    // awning
    const aw = mesh(rbox(0.94, 0.05, 0.26, 0.02), toy(['#ff5a5a', '#2bb3a0', '#ffb020'][x % 3], { cc: 0.6 }), 0, 0.5, front + 0.12, g); aw.rotation.x = 0.25;
  }
  for (let f = 0; f < floors; f++) {
    const yy = 0.3 + f * FH + (opts.shop ? FH * 0.5 + 0.18 : FH * 0.5);
    if (yy > hgt - 0.2) break;
    mesh(new THREE.BoxGeometry(1.0, 0.035, 1.0), toy('#ffffff', { cc: 0.3, t: 0.55 }), 0, 0.3 + f * FH + (opts.shop ? 0.5 : 0), 0, g); // floor line
    mesh(rbox(0.5, 0.36, 0.04, 0.02), glass, -0.08, yy, front + 0.005, g);
    if (hash(x * 5 + f, y) > 0.5) { const cage = mesh(new THREE.BoxGeometry(0.58, 0.42, 0.1), new THREE.MeshStandardMaterial({ map: cageTex, transparent: true, alphaTest: 0.4, color: '#f4f4f4', roughness: 0.3, metalness: 0.4, side: THREE.DoubleSide }), -0.08, yy, front + 0.05, g);
    cage.castShadow = true; } else mesh(new THREE.BoxGeometry(0.62, 0.05, 0.12), toy('#ffffff', { cc: 0.6 }), -0.08, yy - 0.2, front + 0.06, g);
    if (hash(x + f, y + 9) > 0.35) { // air conditioner
      mesh(rbox(0.24, 0.18, 0.14, 0.03), toy('#f7f7f2', { cc: 0.5 }), 0.32, yy - 0.12, front + 0.08, g);
      mesh(new THREE.BoxGeometry(0.16, 0.1, 0.01), toy('#9aa0aa', { cc: 0 }), 0.32, yy - 0.12, front + 0.152, g);
    }
  }
  // rooftop: water tank (頂樓水塔) or a tin-roof add-on (鐵皮加蓋)
  const r = hash(y + 3, x + 7);
  if (r > 0.55) {
    mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.32, 20), toy(r > 0.8 ? '#4aa3ff' : '#d8dde6', { m: r > 0.8 ? 0 : 0.6, r: 0.3 }), 0.18, hgt + 0.3, -0.1, g);
    mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.14, 8), toy('#8d96a6', { m: 0.6 }), 0.18, hgt + 0.07, -0.1, g);
    mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.04, 20), toy('#8d96a6', { m: 0.6 }), 0.18, hgt + 0.48, -0.1, g);
  } else if (r > 0.25) {
    const tin = mesh(rbox(0.7, 0.32, 0.6, 0.03), toy('#9fb8c8', { m: 0.35, r: 0.4 }), -0.05, hgt + 0.16, -0.1, g);

  }

// ---------- camera fit + render loop ----------
const target = new THREE.Vector3(0, 0.35, 0.75);
let baseDist = 15;
function resize() {
  const w = screen.clientWidth, h = screen.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  // phones: frame the action around the player instead of the whole street
  const portrait = camera.aspect < 1;
  target.set(portrait ? X(SCENE.player.x) - 0.6 : 0, 0.35, portrait ? 1.0 : 0.75);
  const needW = portrait ? 7.5 : W - 1.2, vfov = THREE.MathUtils.degToRad(camera.fov);
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  baseDist = Math.max((needW / 2) / Math.tan(hfov / 2), (portrait ? 4 : H + 1.2) / 2 / Math.tan(vfov / 2)) * 0.98;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const bubble = document.getElementById('bubble');
const tmp = new THREE.Vector3();
const clock = new THREE.Clock();
function frame() {
  const t = reduce ? 1.2 : clock.getElapsedTime();
  const sway = reduce ? 0 : Math.sin(t * 0.25) * 0.05;
  const el = THREE.MathUtils.degToRad(52);
  camera.position.set(target.x + Math.sin(sway) * baseDist * Math.cos(el), target.y + baseDist * Math.sin(el), target.z + Math.cos(sway) * baseDist * Math.cos(el));
  camera.lookAt(target);
  anims.forEach(f => f(t));
  renderer.render(scene, camera);
  tmp.set(X(SCENE.player.x), 1.15, Z(SCENE.player.y)).project(camera);
  bubble.style.left = ((tmp.x + 1) / 2 * screen.clientWidth + 70) + 'px';
  bubble.style.top = ((1 - tmp.y) / 2 * screen.clientHeight) + 'px';
  bubble.hidden = false;
  if (!reduce) requestAnimationFrame(frame);
}
document.getElementById('loading').remove();
frame();
