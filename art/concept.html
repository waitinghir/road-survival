const hair = mesh(sph(0.235, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.42), mat('#3a2a3f'), 0, 0.03, -0.05, head); hair.rotation.x = -0.5;
for (const s of [-1, 1]) { mesh(sph(0.035, 12, 10), mat('#2a1f30'), s * 0.08, -0.01, 0.2, head); mesh(sph(0.03, 10, 8), mat('#ff8a9a'), s * 0.13, -0.07, 0.17, head).scale.set(1, 0.6, 0.4); }

// danger pads
const DCOL = KEY === 'dawn' ? { 1: '#f0607e', 2: '#f49a7e', 3: '#f6c49a' } : KEY === 'neon' ? { 1: '#ff1f6e', 2: '#ff8a1f', 3: '#ffe11f' } : { 1: '#ff3b3b', 2: '#ff8a2a', 3: '#ffcc33' };
for (const d of SCENE.danger) {
  const pad = mesh(rbox(0.86, 0.03, 0.86, 0.12), mat(DCOL[d.k], { basic: true, t: KEY === 'neon' ? 0.55 : 0.85 }), X(d.x), 0.03, Z(d.y)); pad.castShadow = false;
  if (KEY === 'neon') { const e = mesh(new THREE.TorusGeometry(0.42, 0.018, 6, 4), mat(DCOL[d.k], { basic: true }), X(d.x), 0.06, Z(d.y)); e.rotation.set(Math.PI / 2, 0, Math.PI / 4); e.scale.set(1.2, 1.2, 1); e.castShadow = false; }
  const tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTex(String(d.k), { w: 128, h: 128, bg: '#ffffff', fg: DCOL[d.k], font: 'Fredoka', size: 92, radius: 64 }), toneMapped: false }));
  tag.scale.setScalar(0.32); tag.position.set(X(d.x) - 0.28, 0.2, Z(d.y) - 0.28); scene.add(tag);
}

// toon outlines (inverted hull)
if (S.outline != null) {
  const om = new THREE.MeshBasicMaterial({ color: S.outline, side: THREE.BackSide });
  const list = []; scene.traverse(o => { if (o.isMesh && !o.isInstancedMesh && !(o.material.transparent) && !(o.material.isMeshBasicMaterial)) list.push(o); });
  for (const o of list) { o.geometry.computeBoundingSphere(); const r = o.geometry.boundingSphere.radius || 0.1; const k = 1 + Math.min(0.16, 0.045 / r);
    const h = new THREE.Mesh(o.geometry, om); h.scale.setScalar(k); h.castShadow = false; o.add(h); }
}

// ---------- camera + post ----------
const target = new THREE.Vector3(0.2, 0.35, 0.75);
const vfov = THREE.MathUtils.degToRad(camera.fov), hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
const dist = Math.max(((W - 1.2) / 2) / Math.tan(hfov / 2), (H + 1.2) / 2 / Math.tan(vfov / 2)) * 0.98 * S.cam.dist;
const el = THREE.MathUtils.degToRad(S.cam.el), yaw = S.cam.yaw;
if (KEY === 'comic') target.set(X(SCENE.player.x) - 0.8, 0.4, Z(SCENE.player.y) - 0.6);
camera.position.set(target.x + Math.sin(yaw) * dist * Math.cos(el), target.y + dist * Math.sin(el), target.z + Math.cos(yaw) * dist * Math.cos(el));
camera.lookAt(target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
if (S.bokeh) { const focus = camera.position.distanceTo(new THREE.Vector3(X(SCENE.player.x), 0.4, Z(SCENE.player.y))); composer.addPass(new BokehPass(scene, camera, { focus, aperture: S.bokeh.aperture, maxblur: S.bokeh.maxblur })); }
if (S.bloom) composer.addPass(new UnrealBloomPass(new THREE.Vector2(WID, HEI), ...S.bloom));
composer.addPass(new OutputPass());
composer.render();

const v = new THREE.Vector3(X(SCENE.player.x), 1.15, Z(SCENE.player.y)).project(camera);
const bub = document.getElementById('bubble'); bub.style.left = ((v.x + 1) / 2 * WID + 80) + 'px'; bub.style.top = ((1 - v.y) / 2 * HEI) + 'px';
const burst = document.getElementById('burst');
if (burst) { const c = SCENE.cars.find(c => c.dir === 'right'); const w = new THREE.Vector3(X(c.x), 0.9, Z(c.y)).project(camera); burst.style.left = ((w.x + 1) / 2 * WID + 40) + 'px'; burst.style.top = ((1 - w.y) / 2 * HEI - 40) + 'px'; }
document.body.dataset.ready = '1';
</script>
</body></html>
