<style>
/* Layout: playfield on a clay "table", side panel of chunky clay buttons; stacks on phones. Single deliberate light, toy-box look. */
:root {
  --bg: #cfe6e1;          /* minty table */
  --bg-dot: #bcdad4;
  --ink: #2d3548;         /* soft navy ink */
  --ink-soft: #5d6680;
  --panel: #fffaf2;
  --panel-edge: #e7dccb;
  --accent: #ff7a59;      /* tomato clay */
  --accent-deep: #d9583a;
  --go: #3fb57a;
  --stop: #e9524a;
  --gold: #ffc53d;
  --f-display: "Bagel Fat One", "Huninn", system-ui, sans-serif;
  --f-body: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg) radial-gradient(var(--bg-dot) 1.5px, transparent 1.6px) 0 0 / 22px 22px;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); margin: 0; letter-spacing: .02em;
  color: var(--accent); text-shadow: 0 3px 0 var(--accent-deep), 0 6px 10px rgba(80,40,20,.18); }
.brand small { color: var(--ink-soft); font-size: 14px; }
.levels { display: flex; gap: 8px; flex-wrap: wrap; }
.lv { font: inherit; border: 0; cursor: pointer; padding: 6px 12px 8px; border-radius: 14px; background: var(--panel); color: var(--ink);
  box-shadow: 0 4px 0 var(--panel-edge), 0 6px 12px rgba(40,60,60,.12); display: flex; gap: 6px; align-items: center; }
.lv[aria-current="true"] { background: var(--ink); color: #fff; box-shadow: 0 4px 0 #161b28; }
.lv .who { font-size: 12px; opacity: .7; }
.lv .stars { color: var(--gold); font-size: 12px; letter-spacing: -1px; }
.lv:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } #info { order: 2; } #legendp { order: 3; } }

.stage { position: relative; background: #f6efe3; border-radius: 26px; padding: 12px;
  box-shadow: 0 8px 0 #e2d5c0, 0 14px 30px rgba(40,60,60,.18); min-width: 0; }
canvas { display: block; width: 100%; height: auto; max-height: 72vh; object-fit: contain; border-radius: 18px; touch-action: none; }
.hud { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
.chip { background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 14px; box-shadow: 0 2px 0 var(--panel-edge);
  font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }

.overlay { position: absolute; inset: 12px; border-radius: 18px; display: grid; place-items: center; background: rgba(45,53,72,.38); padding: 16px; }
.card { background: var(--panel); border-radius: 22px; padding: 20px 22px; max-width: 420px; width: 100%;
  box-shadow: 0 6px 0 var(--panel-edge), 0 16px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 10px; text-align: left; }
.card h2 { font-family: var(--f-display); font-weight: 400; margin: 0; font-size: 28px; text-wrap: balance; }
.card h2.bad { color: var(--stop); } .card h2.good { color: var(--go); }
.card p { margin: 0; }
.card .fact { background: #eef6f3; border-radius: 14px; padding: 10px 12px; font-size: 14px; color: var(--ink-soft); }

.row { display: flex; gap: 8px; flex-wrap: wrap; }

.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.panel h3 { margin: 0 0 4px; font-size: 20px; text-wrap: balance; }
.panel .issue { display: inline-block; background: #ffe3d9; color: var(--accent-deep); font-size: 12px; padding: 2px 10px; border-radius: 999px; letter-spacing: .05em; margin-bottom: 8px; }
.panel p { margin: 0 0 8px; }

.btn { font: inherit; border: 0; cursor: pointer; border-radius: 16px; padding: 10px 14px; background: #fff; color: var(--ink);
  box-shadow: 0 5px 0 var(--panel-edge), 0 8px 14px rgba(40,60,60,.12); transition: transform .06s, box-shadow .06s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--panel-edge); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 5px 0 var(--accent-deep), 0 8px 14px rgba(150,60,30,.25); }
.btn.primary:active { box-shadow: 0 1px 0 var(--accent-deep); }
.pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 56px); gap: 8px; justify-content: center; }
.pad .btn { font-size: 22px; padding: 0; }

.tools { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
.keys { font-size: 13px; color: var(--ink-soft); text-align: center; margin-top: 10px; }
kbd { font-family: inherit; background: #fff; border-radius: 6px; padding: 0 6px; box-shadow: 0 2px 0 var(--panel-edge); }
.legend { display: grid; grid-template-columns: 26px 1fr; gap: 6px 8px; font-size: 13px; align-items: center; }
.sw { width: 24px; height: 18px; border-radius: 6px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

<div class="wrap">

  </header>

  <div class="main">
    <section class="stage">

          <button class="btn" id="b-left" aria-label="往左">◀</button><button class="btn wait" id="b-wait">等一下</button><button class="btn" id="b-right" aria-label="往右">▶</button>

<script>
// ===== CORE (pure game logic, no DOM) =====
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const LEFT_OF = { up: 'left', left: 'down', down: 'right', right: 'up' };
const BACK_OF = { up: 'down', down: 'up', left: 'right', right: 'left' };
const JUNCTION = new Set(['I', 'Z', 'W']);
const PED_OK = new Set(['.', 'r', 'I', 'Z', 'X', 'M', 'W', 'G', 'P', '^']);
const RIDER_OK = new Set(['r', 'I', 'Z', 'X', 'M', 'W', 'G']);
const PUSH_OK = new Set(['.', 'P', 'M', 'r']);
// a stroller can roll onto the road (and get hit there), but not up or down a step
const STROLLER_OK = new Set(['.', 'P', 'r', 'Z', 'I', 'G']);
// entity chars -> [entity kind, underlying tile]
// fixed: s/S parked scooter, c/C parked car. pushable: n shop sign, u potted plant, b trash bin, o/q cone, B stroller
const ENT = {
  s: ['scooter', '.', 1], S: ['scooter', 'M', 1], c: ['car', 'r', 1], C: ['car', '.', 1],
  n: ['sign', '.'], u: ['plant', '.'], b: ['bin', '.'], o: ['cone', 'r'], q: ['cone', 'M'], B: ['stroller', '.'],
};

function parseLevel(def) {
  const h = def.map.length, w = def.map[0].length;
  const tiles = [], push = [], parked = [];
  let start = null;
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      const ch = def.map[y][x];
      if (ch === '@') { start = { x, y }; row.push(def.who === 'rider' ? (def.startTile || 'r') : (def.startTile || '.')); }
      else if (ENT[ch]) {
        const [k, t, fixed] = ENT[ch]; row.push(t);
        if (fixed) parked.push({ x, y, k }); else push.push({ x, y, k });
      } else row.push(ch);
    }
    tiles.push(row);
  }
  const lanes = (def.lanes || []).map((ln, li) => {
    const cells = [];
    for (let i = 0; i < ln.path.length - 1; i++) {
      let [x, y] = ln.path[i]; const [x2, y2] = ln.path[i + 1];
      const dx = Math.sign(x2 - x), dy = Math.sign(y2 - y);
      if (i === 0) cells.push([x, y]);
      while (x !== x2 || y !== y2) { x += dx; y += dy; cells.push([x, y]); }
    }
    return { cells, spawn: ln.spawn, kind: ln.kind || 'car', speed: ln.speed || 1, id: li };
  });
  const laneCell = new Set();
  lanes.forEach(l => l.cells.forEach(([x, y]) => laneCell.add(x + ',' + y)));
  return { ...def, w, h, tiles, start, push, parked, lanes, laneCell, stroller: push.some(p => p.k === 'stroller') };
}

function tileAt(L, x, y) { return (x < 0 || y < 0 || x >= L.w || y >= L.h) ? '#' : L.tiles[y][x]; }

function lightAt(L, tick) {
  if (!L.light) return { v: 'g', h: 'g', remain: 0, phase: -1 };
  const { g, r } = L.light, len = 2 * g + 2 * r;
  const t = ((tick + (L.light.offset || 0)) % len + len) % len;
  if (t < g) return { v: 'g', h: 'r', remain: g - t, phase: 0 };
  if (t < g + r) return { v: 'r', h: 'r', remain: g + r - t, phase: 1 };
  if (t < 2 * g + r) return { v: 'r', h: 'g', remain: 2 * g + r - t, phase: 2 };
  return { v: 'r', h: 'r', remain: len - t, phase: 3 };
}

let CAR_ID = 1;
function carCell(L, c) { return L.lanes[c.lane].cells[c.i]; }

function trafficTick(L, s, withPlayer) {
  const lt = lightAt(L, s.tick);
  const occ = new Set(s.cars.map(c => carCell(L, c).join(',')));
  const pushSet = new Set(s.push.filter(p => p.k !== 'stroller').map(p => p.x + ',' + p.y));
  const pram = s.push.find(p => p.k === 'stroller');
  const parkSet = new Set(L.parked.map(p => p.x + ',' + p.y));
  const maxSp = Math.max(1, ...L.lanes.map(l => l.speed));
  for (let sub = 0; sub < maxSp; sub++)
  for (const lane of L.lanes) {
    if (sub >= lane.speed) continue;
    const mine = s.cars.filter(c => c.lane === lane.id && !c.gone).sort((a, b) => b.i - a.i);
    for (const c of mine) {
      const cur = lane.cells[c.i];
      if (c.i === lane.cells.length - 1) { occ.delete(cur.join(',')); c.gone = true; continue; }
      const n = lane.cells[c.i + 1], nk = n.join(',');
      const curT = tileAt(L, cur[0], cur[1]), nT = tileAt(L, n[0], n[1]);
      if (!JUNCTION.has(curT) && JUNCTION.has(nT)) {
        const axis = n[0] !== cur[0] ? 'h' : 'v';
        if (lt[axis] !== 'g') continue;
      }
      if (occ.has(nk) || pushSet.has(nk) || parkSet.has(nk)) continue;
      if (withPlayer && s.p.x === n[0] && s.p.y === n[1]) {
        if (nT === 'W') continue; // 待轉區 is safe
        if (s.status === 'play') { s.status = 'crash'; s.msg = lane.kind; }
      }
      if (withPlayer && pram && pram.x === n[0] && pram.y === n[1] && s.status === 'play') { s.status = 'crash'; s.msg = 'stroller'; }
      occ.delete(cur.join(',')); occ.add(nk); c.i++;
    }
  }
  s.cars = s.cars.filter(c => !c.gone);
  for (const lane of L.lanes) {
    const sp = lane.spawn;
    if (sp && sp[s.tick % sp.length] === '1') {
      const k = lane.cells[0].join(',');
      const onPlayer = withPlayer && s.p.x === lane.cells[0][0] && s.p.y === lane.cells[0][1];
      if (!occ.has(k)) {
        s.cars.push({ lane: lane.id, i: 0, id: CAR_ID++ }); occ.add(k);
        // a car driving in from off the map hits whoever stands at the edge
        if (onPlayer && s.status === 'play') { s.status = 'crash'; s.msg = lane.kind; }
        if (withPlayer && pram && pram.x === lane.cells[0][0] && pram.y === lane.cells[0][1] && s.status === 'play') { s.status = 'crash'; s.msg = 'stroller'; }
      }
    }
  }
  s.tick++;
}

function initState(L) {
  const s = { p: { ...L.start, f: L.facing || 'up' }, push: L.push.map(p => ({ ...p })), cars: [], tick: 0, status: 'play', msg: '', steps: 0 };
  for (let i = 0; i < (L.warm ?? 24); i++) trafficTick(L, s, false);
  return s;
}

function cloneState(s) {
  return { p: { ...s.p }, push: s.push.map(p => ({ ...p })), cars: s.cars.map(c => ({ ...c })), tick: s.tick, status: s.status, msg: s.msg, steps: s.steps };
}

// returns new state, or null if the move is blocked (no turn spent)
function step(L, s0, dir) {
  if (s0.status !== 'play') return null;
  const s = cloneState(s0);
  const rider = L.who === 'rider';
  s.pushed = null;
  if (dir) {
    const [dx, dy] = DIRS[dir];
    const fromT = tileAt(L, s.p.x, s.p.y);
    const nx = s.p.x + dx, ny = s.p.y + dy;
    const t = tileAt(L, nx, ny);
    const ok = rider ? RIDER_OK : PED_OK;
    if (!ok.has(t)) return null;
    if (L.parked.some(p => p.x === nx && p.y === ny)) return null;
    const carHere = s.cars.some(c => { const [cx, cy] = carCell(L, c); return cx === nx && cy === ny; });
    if (carHere) return null;
    const pi = s.push.findIndex(p => p.x === nx && p.y === ny);
    if (pi >= 0) {
      const bx = nx + dx, by = ny + dy, bt = tileAt(L, bx, by);
      if (s.push[pi].k === 'stroller') { if (!STROLLER_OK.has(bt) || tileAt(L, nx, ny) === '^') return null; }
      else if (!PUSH_OK.has(bt) || L.laneCell.has(bx + ',' + by)) return null;
      if (s.push.some(p => p.x === bx && p.y === by)) return null;
      if (L.parked.some(p => p.x === bx && p.y === by)) return null;
      if (s.cars.some(c => { const [cx, cy] = carCell(L, c); return cx === bx && cy === by; })) return null;
      s.push[pi] = { ...s.push[pi], x: bx, y: by };
      s.pushed = s.push[pi];
    }
    // rider traffic rules
    if (rider) {
      const lt = lightAt(L, s.tick);
      if (t === 'X') { s.status = 'ticket'; s.msg = 'nomoto'; }
      else if (fromT === 'I' && (dir === LEFT_OF[s.p.f] || dir === BACK_OF[s.p.f])) { s.status = 'ticket'; s.msg = 'leftturn'; }
      else if (t === 'I' && fromT !== 'I') {
        const axis = dx !== 0 ? 'h' : 'v';
        if (lt[axis] !== 'g') { s.status = 'ticket'; s.msg = 'redlight'; }
      }
    }
    s.p.x = nx; s.p.y = ny; s.p.f = dir;
  }
  s.steps++;
  if (s.status !== 'play') return s;
  if (L.stroller) { const pr = s.push.find(p => p.k === 'stroller'); if (tileAt(L, pr.x, pr.y) === 'G') { s.status = 'win'; return s; } }
  else if (tileAt(L, s.p.x, s.p.y) === 'G') { s.status = 'win'; return s; }
  trafficTick(L, s, true);
  return s;
}


// cells that a car will drive into (or through) during the next traffic tick
function dangerCells(L, s) {
  const t = cloneState(s); t.status = 'play';
  const before = new Map(t.cars.map(c => [c.id, c.i]));
  trafficTick(L, t, false);
  const out = new Set();
  const after = new Map(t.cars.map(c => [c.id, c]));
  const mark = (lane, from, to) => { for (let i = from; i <= to; i++) { const [x, y] = lane.cells[i]; if (tileAt(L, x, y) !== 'W') out.add(x + ',' + y); } };
  for (const c of t.cars) mark(L.lanes[c.lane], before.has(c.id) ? before.get(c.id) + 1 : 0, c.i);
  // cars that drove off the map this tick still crossed the cells up to the edge
  for (const c of s.cars) if (!after.has(c.id)) { const lane = L.lanes[c.lane]; mark(lane, c.i + 1, lane.cells.length - 1); }
  return out;
}


// for the next n traffic ticks (player standing still), the first tick at which a car drives into each cell
function dangerTimeline(L, s, n) {
  const out = new Map();
  let cur = cloneState(s); cur.status = 'play';
  for (let k = 1; k <= n; k++) {
    for (const key of dangerCells(L, cur)) if (!out.has(key)) out.set(key, k);
    const nx = cloneState(cur); trafficTick(L, nx, false); cur = nx;
  }
  return out;
}

function stateKey(L, s) {
  return s.p.x + ',' + s.p.y + ',' + (L.who === 'rider' ? s.p.f : '') + '|' +
    s.push.map(p => p.x + ',' + p.y).sort().join(';') + '|' +
    s.cars.map(c => c.lane + ':' + c.i).sort().join(';') + '|' + (s.tick % (L.period || 840));
}

function solve(L, maxDepth = 80, limit = 400000) {
  const s0 = initState(L);
  let frontier = [{ s: s0, path: '' }];
  const seen = new Set([stateKey(L, s0)]);
  const moves = [null, 'left', 'up', 'down', 'right'];
  for (let d = 0; d < maxDepth && frontier.length; d++) {
    const next = [];
    for (const { s, path } of frontier) {
      for (const m of moves) {
        const n = step(L, s, m);
        if (!n) continue;
        const np = path + (m ? m[0].toUpperCase() : '.');
        if (n.status === 'win') return { steps: d + 1, path: np, explored: seen.size };
        if (n.status !== 'play') continue;
        const k = stateKey(L, n);
        if (seen.has(k)) continue;
        seen.add(k);
        next.push({ s: n, path: np });
      }
    }
    if (seen.size > limit) return { steps: -1, explored: seen.size, reason: 'limit' };
    frontier = next;
  }
  return { steps: -1, explored: seen.size };
}

// ===== END CORE =====

// ===== LEVELS =====
// map legend: # building  . 騎樓/sidewalk  ^ step (people can climb it, strollers can't)  P shopfront nook
// r road  I junction  Z zebra  X no-scooter lane  M scooter lane  W left-turn box  G goal  ~ river
// fixed: s/S parked scooter  c/C parked car.  pushable: n shop sign  u potted plant  b trash bin  o/q cone  B stroller
const LEVELS = [
  {
    id: 1, who: 'ped', name: '騎樓障礙賽', goal: '捷運',
    issue: '騎樓被機車和店家雜物佔滿',
    intro: '騎樓停滿了機車，店家又把招牌和垃圾桶擺出來。往左走到捷運站：機車推不動，但招牌和垃圾桶可以推回店門口的空位，讓你有地方躲車。',
    tip: '迎面來的車會停不下來。先躲在空檔，等車過了再衝；站到馬路上，才能從下面把招牌推回店門口。',
    fact: '騎樓與人行道被機車、攤位和店家雜物佔用，行人只好走到車道上和車爭道。',
    map: [
      '##############',
      '####P###P#####',
      'G.ssnsssbsss.@',
      'rrrrrrrrrrrrrr',
      '##############',
    ],
    lanes: [
      { path: [[0, 3], [13, 3]], spawn: '1000000000000' },
    ],
  },
  {
    id: 2, who: 'ped', name: '斑馬線上的違停', goal: '學校',
    issue: '違停車擋住行人穿越道',

function act(dir) {
  if (!overlay.hidden) return;

  const n = step(L, S, dir);
  if (!n) { fx = { kind: 'bump', t0: performance.now(), dir }; return; }
  hist.push(S);
  anim = { from: S, to: n, t0: performance.now(), dur: 170 };
  S = n; renderHud();
  if (S.status !== 'play') {
    fx = { kind: S.status, t0: performance.now() };
    setTimeout(showEnd, S.status === 'win' ? 420 : 700);
  }
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); }

}

function drawGround(t) {

    const T = L.tiles[y][x], X = px(x), Y = py(y);

function ease(k) { return k < 0 ? 0 : k > 1 ? 1 : 1 - Math.pow(1 - k, 3); }
function carDir(lane, i) {

function frame(t) {
  const k = anim ? ease((t - anim.t0) / anim.dur) : 1;
  if (anim && k >= 1) anim = null;
  const prev = anim ? anim.from : null;
  drawGround(t);
  // danger preview: where cars will drive in the next 3 turns (red = next turn)
  if (S.status === 'play') {
    if (dangerFor !== S) { dangerFor = S; dangerMap = dangerTimeline(L, S, 3); }
    const pulse = .5 + .5 * Math.sin(t / 180);
    const STYLE = { 1: ['255,80,70', .22 + .18 * pulse, .9], 2: ['255,150,60', .2, .7], 3: ['255,205,70', .16, .55] };
    for (const [key, kk] of dangerMap) {
      const [x, y] = key.split(',').map(Number);
      const [c, fa, sa] = STYLE[kk];
      rr(px(x) + 5, py(y) + 5, CS - 10, CS - 10, 12);
      ctx.fillStyle = `rgba(${c},${fa})`; ctx.fill();
      ctx.strokeStyle = `rgba(${c},${sa})`; ctx.lineWidth = kk === 1 ? 2.5 : 2; ctx.setLineDash(kk === 1 ? [7, 5] : [4, 5]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = `rgba(${c},1)`; ctx.font = '700 12px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(kk), px(x) + 14, py(y) + 15);
    }
  }
  // collect drawables
  const items = [];
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) if (L.tiles[y][x] === '#') items.push({ y, fn: () => drawBuilding(x, y) });
  L.parked.forEach((p, i) => items.push({ y: p.y, fn: () => p.k === 'scooter'
    ? drawScooter(px(p.x), py(p.y), ['#9aa3b8', '#b4a6c9', '#a7bfb5', '#c9b3a6'][(p.x * 7 + p.y) % 4], 'up')
    : drawCar(px(p.x), py(p.y), '#b7bfd1', (L.tiles[p.y][p.x] === '.' ? 'right' : 'up')) }));
  // parked-car hazard tag
  S.push.forEach((p, i) => {
    let x = p.x, y = p.y;
    if (prev && prev.push[i]) { x = prev.push[i].x + (p.x - prev.push[i].x) * k; y = prev.push[i].y + (p.y - prev.push[i].y) * k; }
    const col = COLORS.carCols[(i * 3 + L.id) % COLORS.carCols.length];
    const draw = { cone: drawCone, sign: drawSign, plant: drawPlant, bin: drawBin, stroller: drawStroller }[p.k] || drawSign;
    items.push({ y, fn: () => draw(px(x), py(y)) });
  });
  const prevCars = new Map(prev ? prev.cars.map(c => [c.id, c]) : []);
  for (const c of S.cars) {
    const lane = L.lanes[c.lane];
    const [cx1, cy1] = lane.cells[c.i];
    let x = cx1, y = cy1;
    const pc = prevCars.get(c.id);
    if (anim) {
      let fx0, fy0;
      if (pc) [fx0, fy0] = lane.cells[pc.i];
      else { const d = carDir(lane, 0); fx0 = cx1 - (d === 'right' ? 1 : d === 'left' ? -1 : 0); fy0 = cy1 - (d === 'down' ? 1 : d === 'up' ? -1 : 0); }
      x = fx0 + (cx1 - fx0) * k; y = fy0 + (cy1 - fy0) * k;
    }
    const col = lane.kind === 'moto' ? '#9ad0ff' : COLORS.carCols[c.id % COLORS.carCols.length];
    const dir = carDir(lane, c.i);
    items.push({ y, fn: () => lane.kind === 'moto' ? drawScooter(px(x), py(y), col, dir) : drawCar(px(x), py(y), col, dir) });
  }
  // cars that just left the map: let them slide off
  if (anim) for (const pc of prev.cars) if (!S.cars.some(c => c.id === pc.id)) {
    const lane = L.lanes[pc.lane]; const [x0, y0] = lane.cells[pc.i]; const d = carDir(lane, pc.i);
    const x = x0 + (d === 'right' ? 1 : d === 'left' ? -1 : 0) * k * lane.speed, y = y0 + (d === 'down' ? 1 : d === 'up' ? -1 : 0) * k * lane.speed;
    items.push({ y, fn: () => drawCar(px(x), py(y), COLORS.carCols[pc.id % COLORS.carCols.length], d) });
  }
  // player
  let ppx = S.p.x, ppy = S.p.y;
  if (prev) { ppx = prev.p.x + (S.p.x - prev.p.x) * k; ppy = prev.p.y + (S.p.y - prev.p.y) * k; }
  let shx = 0;
  if (fx && fx.kind === 'bump' && t - fx.t0 < 160) { const d = DIRS[fx.dir] || [0, 0]; const a = Math.sin((t - fx.t0) / 160 * Math.PI) * .12; ppx += d[0] * a; ppy += d[1] * a; }
  if (fx && (fx.kind === 'crash' || fx.kind === 'ticket') && t - fx.t0 < 500) shx = Math.sin((t - fx.t0) / 30) * 4 * (1 - (t - fx.t0) / 500);
  items.push({ y: ppy + .01, fn: () => { ctx.save(); ctx.translate(shx, 0); L.who === 'rider' ? drawRider(px(ppx), py(ppy), S.p.f, t) : drawPed(px(ppx), py(ppy), S.p.f, t); ctx.restore(); } });

  items.sort((a, b) => a.y - b.y).forEach(it => it.fn());

  const lt = lightAt(L, S.tick);
  (LEVELS[levelIdx].signals || []).forEach(s => drawSignal(s.x, s.y, s.axis, lt));

  // speech bubble on fail / win
  if (fx && fx.kind !== 'bump') {
    const age = t - fx.t0, sc = ease(age / 220);
    const text = fx.kind === 'win' ? '到了！' : fx.kind === 'ticket' ? '嗶！' : '叭！';
    const bx = px(S.p.x) + CS / 2, by = py(S.p.y) - 34;
    ctx.save(); ctx.translate(bx, by); ctx.scale(sc, sc);
    rr(-34, -22, 68, 36, 16); ctx.fillStyle = fx.kind === 'win' ? '#3fb57a' : fx.kind === 'ticket' ? '#3f6ff0' : '#e9524a'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, 13); ctx.lineTo(0, 24); ctx.lineTo(6, 13); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '22px ' + getComputedStyle(document.documentElement).getPropertyValue('--f-display'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 0, -3); ctx.restore();
  }
  requestAnimationFrame(frame);
}

function boot(data) {
  loadLevel(Math.min(Math.max(data?.level ?? 0, 0), LEVELS.length - 1));
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ level: levelIdx }));
document.fonts?.ready?.then(() => {});
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
